[project]
name = "wiki-cli"
version = "0.1.0"
description = "Personal investing wiki: local Gemma + RAG harness with chat, ask, search and ingest modes."
readme = "README.md"
requires-python = ">=3.12"
# No third-party dependencies: HTTP to Ollama, TOML, JSON and BM25 all use the
# standard library, so the CLI installs and runs with no internet connection.
dependencies = []

[project.scripts]
wiki = "wiki_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_cli"]
